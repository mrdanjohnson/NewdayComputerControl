[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32 @ ^6.10.0
board = esp32-s3-devkitc-1
framework = arduino
build_unflags =
    -std=gnu++11
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
    -DMC_FW_VERSION=\"1.6.0-phase6\"
# Spec 15.3 layout: factory recovery + ota_0/ota_1 (0x1F0000 each) + LittleFS
# (0x210000). Rollback is enabled in the Arduino core's precompiled
# bootloader/sdkconfig (CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y — see
# sdkconfig.defaults for the full note); board_build.sdkconfig is listed for
# any future espidf-mixed build and is otherwise inert for framework=arduino.
board_build.partitions = partitions_maccontrol.csv
board_build.sdkconfig = sdkconfig.defaults
upload_speed = 921600
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    maccontrol_core = symlink://lib/maccontrol_core

# Classic ESP32 (ESP-WROOM-32 and friends). NOTE: these chips have no native
# USB device controller, so HID dispatch always fails as dispatch_error —
# the REST surface, ledger, and Mode A semantics still work. See docs/PHASE1.md.
[env:esp32-wroom-32]
platform = espressif32 @ ^6.10.0
board = esp32dev
framework = arduino
build_unflags =
    -std=gnu++11
# Phase 4 grows the image past the default 1.3 MB OTA app slot; min_spiffs
# keeps both OTA slots at ~1.9 MB (SPIFFS shrinks to 64 KB — the firmware
# uses LittleFS, not SPIFFS). 4 MB flash cannot fit a factory slot, so
# factory recovery is S3-only (partitions_maccontrol.csv; mc_openapi.cpp
# amendment note). Rollback (CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE) is
# precompiled into the Arduino core bootloader (see sdkconfig.defaults).
board_build.partitions = min_spiffs.csv
board_build.sdkconfig = sdkconfig.defaults
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
    -DMC_FW_VERSION=\"1.6.0-phase6\"
upload_speed = 460800
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    maccontrol_core = symlink://lib/maccontrol_core

[env:native]
platform = native
build_flags =
    -std=gnu++17
    -g
    -DMC_NATIVE_HOST=1
    -DMC_FW_VERSION=\"dev\"
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    maccontrol_core = symlink://lib/maccontrol_core
test_framework = googletest
