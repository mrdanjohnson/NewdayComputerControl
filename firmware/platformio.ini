[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32 @ ^6.10.0
board = esp32-s3-devkitc-1
framework = arduino
build_unflags =
    -std=gnu++11
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
upload_speed = 921600
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    maccontrol_core = symlink://lib/maccontrol_core

# Classic ESP32 (ESP-WROOM-32 and friends). NOTE: these chips have no native
# USB device controller, so HID dispatch always fails as dispatch_error —
# the REST surface, ledger, and Mode A semantics still work. See docs/PHASE1.md.
[env:esp32-wroom-32]
platform = espressif32 @ ^6.10.0
board = esp32dev
framework = arduino
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
# Phase 4 grows the image past the default 1.3 MB OTA app slot; min_spiffs
# keeps both OTA slots at ~1.9 MB (SPIFFS shrinks to 64 KB — the firmware
# uses LittleFS, not SPIFFS).
board_build.partitions = min_spiffs.csv
upload_speed = 460800
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    maccontrol_core = symlink://lib/maccontrol_core

[env:native]
platform = native
build_flags =
    -std=gnu++17
    -g
    -DMC_NATIVE_HOST=1
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    maccontrol_core = symlink://lib/maccontrol_core
test_framework = googletest
